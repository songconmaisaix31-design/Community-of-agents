map $http_origin $gongzhi_origin {
  default "";
  ~^http://(127\.0\.0\.1|localhost):(3039|3041)$ $http_origin;
}
server {
  listen 80;
  server_name _;
  access_log off;
  location /auth/v1/ {
    add_header Access-Control-Allow-Origin $gongzhi_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "apikey, authorization, content-type, x-client-info, x-supabase-api-version" always;
    add_header Access-Control-Max-Age "600" always;
    add_header Vary "Origin" always;
    if ($request_method = OPTIONS) { return 204; }
    proxy_pass http://auth:9999/;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
  }
  location / { return 404; }
}
